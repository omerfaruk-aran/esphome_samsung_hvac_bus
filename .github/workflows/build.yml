name: Build and Test
on:
  push:
    paths-ignore:
      - 'README.md'
      - 'example.yaml'
      - 'nasa.md'
      - 'security.md'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'docs/model-checker/**'
      - '.github/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'example.yaml'
      - 'nasa.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'docs/model-checker/**'
      - '.github/**'
      
jobs:
  framework-arduino:
    runs-on: ubuntu-latest     
    steps:
    - uses: actions/checkout@v5
    - uses: esphome/build-action@v7.0.0
      id: esphome-build
      with:
        yaml-file: .github/conf_arduino.yml
  
  framework-espidf:
    runs-on: ubuntu-latest     
    steps:
    - uses: actions/checkout@v5
    - uses: esphome/build-action@v7.0.0
      id: esphome-build
      with:
        yaml-file: .github/conf_esp_idf.yml

  # Native protocol tests live in .github/workflows/native-tests.yml

