esphome:
  name: espidf

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: ../components

uart:
  tx_pin: GPIO19
  rx_pin: GPIO22
  baud_rate: 9600
  parity: EVEN

# Compile fixture only: unavailable source, runtime sender starts OFF.
sensor:
  - platform: template
    id: external_temperature_fixture
    internal: true
    lambda: return NAN;
    update_interval: 45s

samsung_ac:
  debug_mqtt_host: 192.168.1.100
  debug_mqtt_port: 1883
  debug_mqtt_username: mqtt_user
  debug_mqtt_password: mqtt_pass

  debug_log_messages: false
  debug_log_messages_raw: false

  devices:
    - address: "20.00.00"
      external_room_temperature:
        experimental: true
        acknowledge_latched_temperature: true
        controller_absent_confirmed: true
        sensor: external_temperature_fixture
        source_address: "50.00.00"
        debug: true
        enable_switch:
          name: Test_external_temperature_enable
        input_temperature:
          name: Test_external_temperature_input
        sent_temperature:
          name: Test_external_temperature_sent
        reported_temperature:
          name: Test_external_temperature_reported
        fresh:
          name: Test_external_temperature_fresh
        reported_match:
          name: Test_external_temperature_reported_match
        status:
          name: Test_external_temperature_status
        failures:
          name: Test_external_temperature_failures
      climate:
        name: "Test"
      room_temperature:
        name: Test1_temp
      target_temperature:
        name: Test1_target
      power:
        name: Test1_power
      display_light:
        name: Test1_display_light
        state_valid:
          name: Test1_display_light_state_valid
